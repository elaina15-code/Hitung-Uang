<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Trading</title>

<style>
body{
background:#0f0f0f;
color:white;
font-family:Arial;
text-align:center;
padding:30px;
}

.box{
background:#1e1e1e;
padding:20px;
border-radius:10px;
max-width:320px;
margin:auto;
}

button,input{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
}

.buy{background:#00c853;color:white;}
.sell{background:#ff1744;color:white;}
.deposit{background:#2962ff;color:white;}
.withdraw{background:#ff9100;color:white;}
</style>

</head>
<body>

<div class="box">

<h2>Mini Trading</h2>

<h3>Balance: $<span id="saldo">100</span></h3>
<h3>Price: $<span id="price">100</span></h3>
<h4>Asset: <span id="asset">0</span></h4>

<input type="number" id="amount" placeholder="Jumlah">

<button class="deposit" onclick="deposit()">Deposit</button>
<button class="withdraw" onclick="withdraw()">Withdraw</button>

<button class="buy" onclick="buy()">BUY</button>
<button class="sell" onclick="sell()">SELL</button>

</div>

<script>

let saldo = 100
let price = 100
let asset = 0

function update(){
document.getElementById("saldo").innerText = saldo.toFixed(2)
document.getElementById("price").innerText = price.toFixed(2)
document.getElementById("asset").innerText = asset.toFixed(4)
}

function deposit(){
let a = Number(amount.value)
saldo += a
update()
}

function withdraw(){
let a = Number(amount.value)
if(a > saldo){
alert("saldo kurang")
return
}
saldo -= a
update()
}

function buy(){
let a = Number(amount.value)
if(a > saldo){
alert("saldo kurang")
return
}

let qty = a / price
asset += qty
saldo -= a
update()
}

function sell(){
let a = Number(amount.value)
if(a > asset){
alert("asset kurang")
return
}

let uang = a * price
asset -= a
saldo += uang
update()
}

setInterval(()=>{
price += (Math.random() - 0.5) * 2
update()
},2000)

update()

</script>

</body>
</html>
